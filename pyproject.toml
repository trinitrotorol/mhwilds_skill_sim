[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhwilds-skill-sim"
version = "0.1.0"
description = "Minimal package scaffold for Monster Hunter Wilds skill simulation."
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.26.0",
    "fastapi>=0.115,<1",
    "ortools>=9.15,<10",
    "uvicorn>=0.51,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
