name: Verify inventory service
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Bootstrap local pinned tools
        run: |
          ./scripts/bootstrap.sh
          sh ./scripts/pyw -m pip install -r requirements-service.txt
          sh ./scripts/pyw -m pip install --no-deps -e .
          ./scripts/npmw --prefix apps/web ci
          cd subprojects/inventory-checker
          ./scripts/bootstrap.sh
          ./scripts/npmw ci
      - name: Verify parent, child and contract integration
        run: sh scripts/verify-service.sh
      - name: Build isolated synthetic smoke release
        run: sh scripts/pyw -m scripts.build_service --fixture --source data/fixtures/tiny_catalog.json
